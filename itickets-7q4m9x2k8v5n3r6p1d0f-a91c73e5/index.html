<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>iTickets</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f4f6;color:#111;font-family:Arial,sans-serif}
    .wrap{max-width:520px;margin:auto;padding:24px 18px 40px}
    .card{background:white;border-radius:18px;padding:22px;box-shadow:0 5px 24px rgba(0,0,0,.08)}
    h1{margin:0 0 4px;font-size:30px}
    .sub,.status{color:#666;font-size:14px}
    .status{margin:14px 0;padding:10px 12px;background:#f3f3f3;border-radius:10px}
    label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}
    input{width:100%;font-size:22px;padding:13px;border:1px solid #bbb;border-radius:10px}
    button{width:100%;margin-top:18px;padding:15px;border:0;border-radius:11px;background:#111;color:#fff;font-size:17px;font-weight:700}
    button:disabled{opacity:.45}
    #photopea{position:fixed;width:1px;height:1px;border:0;opacity:0;pointer-events:none}
    .small{font-size:12px;color:#777;margin-top:10px}
  
    #lock{position:fixed;inset:0;z-index:9999;background:#f4f4f6;display:flex;align-items:center;justify-content:center;padding:20px}
    #lock .box{width:min(420px,100%);background:#fff;padding:24px;border-radius:18px;box-shadow:0 5px 24px rgba(0,0,0,.10)}
    #lock h2{margin:0 0 6px;font-size:27px}
    #lock p{color:#666;margin:0 0 15px}
    #lockError{min-height:20px;color:#b00020;font-size:13px;margin-top:8px}

    #successState{
      display:none;
      text-align:center;
      margin:28px 0 8px;
    }
    #successState.show{display:block;}
    #successCheck{
      width:92px;height:92px;margin:0 auto 16px;
      border-radius:50%;
      background:#20a84a;color:white;
      font-size:60px;font-weight:700;line-height:92px;
    }
    #successText{
      font-size:22px;font-weight:700;margin-bottom:18px;
    }


body{margin:0;background:#f4f5f7;font-family:Arial,sans-serif;color:#111}
.app{box-sizing:border-box;width:min(100%,520px);min-height:100vh;margin:auto;background:#fff;padding:26px 24px;box-shadow:0 3px 22px rgba(0,0,0,.08)}
.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-size:30px}.brand img{width:31px;height:31px;object-fit:contain}.menu{font-size:30px}
.subtitle{font-size:17px;color:#747c8c;margin:3px 0 30px}
label{display:block;font-size:16px;font-weight:700;margin-bottom:9px}
#board{box-sizing:border-box;width:100%;font-size:27px;padding:16px;border:1px solid #cbd0d7;border-radius:12px;margin-bottom:20px;outline:none}
.mainbtn{width:100%;border:0;border-radius:10px;background:#111;color:#fff;padding:18px 12px;font-size:18px;font-weight:700;cursor:pointer}
.mainbtn:disabled{opacity:.65}
.cards{text-align:center;margin:24px 0 10px}.cards img{width:230px;max-width:78%;height:auto;object-fit:contain}
.safe{display:flex;align-items:center;gap:11px;color:#7a8290;font-size:14px}.safe span{height:1px;background:#d8dce2;flex:1}
.cardbox{margin-top:19px;background:#fafbfc;border:1px solid #e1e4e8;border-radius:12px;padding:13px}.small{font-size:13px;color:#7a8290;margin-bottom:7px}
.cardrow{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #ccd2da;border-radius:9px;padding:12px 13px;font-size:20px}.cardrow img{width:54px;height:27px;object-fit:contain}
.secured{color:#7a8290;font-size:14px;margin:18px 4px}.hidden{display:none!important}
#processingState,#successState{text-align:center;padding:70px 0 35px}
.spinner{width:50px;height:50px;border:6px solid #e3e6ea;border-top-color:#111;border-radius:50%;margin:0 auto 22px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}.processTitle{font-size:21px;font-weight:700}.processSub{color:#7a8290;margin-top:9px}
.check{width:90px;height:90px;border-radius:50%;background:#13b85c;color:#fff;font-size:60px;line-height:90px;font-weight:700;margin:0 auto 17px}
.ready{color:#13aa54;font-size:22px;font-weight:800;margin-bottom:23px}
#status{font-size:13px;color:#7a8290;text-align:center;margin-top:12px}footer{text-align:center;color:#7a8290;font-size:13px;margin-top:42px}


.ticketReady{font-size:21px;font-weight:700;margin-bottom:22px}
.paymentProcessing{padding:28px 0 4px;color:#555;font-size:17px}
.smallspin{width:38px;height:38px;border-width:5px;margin-bottom:16px}
.thanks{font-size:18px;line-height:1.5;color:#333;margin-top:8px}
</style>
</head>

  </section>

  <section id="processingState" class="hidden">
    <div class="spinner"></div>
    <div class="processTitle">Se generează ticketul...</div>
    <div class="processSub">Vă rugăm să așteptați</div>
  </section>

  <section id="successState" class="hidden">
    <div id="ticketReady" class="ticketReady">Ticketul este pregătit</div>
    <button id="saveAgain" class="mainbtn">ACHITĂ</button>
    <div id="paymentProcessing" class="hidden paymentProcessing">
      <div class="spinner smallspin"></div>
      <div>Se procesează tranzacția...</div>
    </div>
    <div id="paymentDone" class="hidden">
      <div class="check">✓</div>
      <div class="ready">TRANZACȚIE REUȘITĂ</div>
      <div class="thanks">Vă mulțumim!<br>Mesajul a fost trimis.</div>
    </div>
  </section>

  <div id="status"></div>
  <footer>iTickets • P.UA 2026</footer>
</div>
<iframe id="photopea"
  src="https://www.photopea.com#%7B%22environment%22%3A%7B%22vmode%22%3A2%2C%22intro%22%3Afalse%2C%22localsave%22%3Afalse%7D%7D">
</iframe>
<script>
const entryState=document.getElementById("entryState");
const processingState=document.getElementById("processingState");
const successState=document.getElementById("successState");
const ticketReady=document.getElementById("ticketReady");
const paymentProcessing=document.getElementById("paymentProcessing");
const paymentDone=document.getElementById("paymentDone");

  

(() => {
  "use strict";
  const pp = document.getElementById("photopea");
  const status = document.getElementById("status");
  const button = document.getElementById("generate");
  const board = document.getElementById("board");
const saveAgain = document.getElementById("saveAgain");
  const PHOTOPEA_ORIGIN = "https://www.photopea.com";
  let state = "boot", busy = false, lastBlob = null, lastUrl = null;
  button.disabled=true;

  function setStatus(t){ status.textContent=t; }
  function fail(t){ busy=false; setStatus("Error: "+t); button.disabled = state!=="ready"; button.textContent="CONFIRMĂ BORDUL"; }
  function sendScript(s){ pp.contentWindow.postMessage(s, PHOTOPEA_ORIGIN); }

  async function loadPsd(){
    try{
      const r=await fetch("./template.psd",{cache:"no-store"});
      if(!r.ok) throw new Error("template.psd HTTP "+r.status);
      pp.contentWindow.postMessage(await r.arrayBuffer(), PHOTOPEA_ORIGIN);
    }catch(e){ fail("PSD load error: "+e.message); }
  }

  const tagScript = `
    function findLayer(container,wantedName){
      for(var i=0;i<container.layers.length;i++){
        var layer=container.layers[i];
        if(layer.name===wantedName)return layer;
        try{if(layer.layers&&layer.layers.length){var f=findLayer(layer,wantedName);if(f)return f;}}catch(_){}
      } return null;
    }
    function renameRequired(oldName,newName){
      var layer=findLayer(app.activeDocument,oldName);
      if(!layer)throw new Error("Missing PSD layer: "+oldName);
      layer.name=newName;
    }
    try{
      renameRequired("08.09.2026","__DATE__");
      renameRequired("3:12 PM SUS","__TIME_TOP__");
      renameRequired("3:12 PM JOS","__TIME_BOTTOM__");
      renameRequired("15:12 Ora in Mesaj","__TIME_MESSAGE__");
      renameRequired("0821 Bord Nr","__BOARD__");
      app.echoToOE("__READY__");
    }catch(e){app.echoToOE("__ERROR__"+e.toString());}
  `;

  function pad(n){return String(n).padStart(2,"0")}
  function valuesNow(){
    const d=new Date(), h=d.getHours(), h12=(h%12)||12, ap=h>=12?"PM":"AM";
    return {
      date:pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear(),
      t24:pad(h)+":"+pad(d.getMinutes()),
      t12:h12+":"+pad(d.getMinutes())+" "+ap
    };
  }

  function showResult(blob){
    if(lastUrl) URL.revokeObjectURL(lastUrl);
    lastBlob=blob;
    lastUrl=URL.createObjectURL(blob);
saveAgain.style.display="block"; saveAgain.textContent="ACHITĂ"; 
  }

  async function makeCleanJpeg(blob){
    const bitmap = await createImageBitmap(blob);
    const canvas = document.createElement("canvas");
    canvas.width = bitmap.width;
    canvas.height = bitmap.height;
    const ctx = canvas.getContext("2d", {alpha:false});
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(bitmap,0,0);
    if(bitmap.close) bitmap.close();

    return await new Promise((resolve,reject)=>{
      canvas.toBlob(
        b => b ? resolve(b) : reject(new Error("Could not create clean JPG")),
        "image/jpeg",
        1.0
      );
    });
  }

  async function saveImage(blob){
    if(!blob) return;
    saveAgain.disabled=true;
    
    try{
      const cleanBlob=await makeCleanJpeg(blob);
      const fileName="iTickets_"+Date.now()+".jpg";
      const url=URL.createObjectURL(cleanBlob);
      const a=document.createElement("a");
      a.href=url;
      a.download=fileName;
      a.rel="noopener";
      a.style.display="none";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),60000);
      
      saveAgain.disabled=false;
    }catch(e){
      saveAgain.textContent="ACHITĂ";
      saveAgain.disabled=false;
      alert("Save error: "+e.message);
    }
  }

  saveAgain.onclick=async()=>{
    if(!lastBlob) return;
    saveAgain.disabled=true;
    ticketReady.classList.add("hidden");
    saveAgain.classList.add("hidden");
    paymentProcessing.classList.remove("hidden");

    await new Promise(resolve=>setTimeout(resolve,1800));

    try{
      await saveImage(lastBlob);
      paymentProcessing.classList.add("hidden");
      paymentDone.classList.remove("hidden");
    }catch(e){
      paymentProcessing.classList.add("hidden");
      ticketReady.classList.remove("hidden");
      saveAgain.classList.remove("hidden");
      saveAgain.disabled=false;
    }
  };

  window.addEventListener("message", e=>{
    if(e.source!==pp.contentWindow)return;
    const data=e.data;
    if(data==="done"){
      if(state==="boot"){state="loading_psd";loadPsd();return;}
      if(state==="loading_psd"){state="tagging";sendScript(tagScript);return;}
      return;
    }
    if(typeof data==="string"){
      if(data==="__READY__"){
        state="ready"; busy=false; setStatus("");
        button.disabled=false; button.textContent="CONFIRMĂ BORDUL"; return;
      }
      if(data.startsWith("__ERROR__")){fail(data.slice(9));return;}
    }
    if(data instanceof ArrayBuffer){
      busy=false; button.disabled=false; button.textContent="CONFIRMĂ BORDUL";
      setStatus("");
      const blob=new Blob([data],{type:"image/jpeg"});
      showResult(blob);
      processingState.classList.add("hidden");
      successState.classList.remove("hidden");
      // Keep the explicit save button for mobile browsers,
      // where a later user tap is the most reliable way to open Save/Share.

    }
  });

  button.onclick=()=>{
    if(busy)return;
    if(state!=="ready"){
      setStatus("Se încarcă sistemul. Încercați din nou peste o secundă.");
      return;
    }
    const b=board.value.trim();
    if(!b){alert("BOARD cannot be empty");return;}
    const v=valuesNow();
    entryState.classList.add("hidden");
    successState.classList.add("hidden");
    processingState.classList.remove("hidden");
    busy=true;button.disabled=true;button.textContent="SE GENEREAZĂ…";
    setStatus("Generating "+v.date+" · "+v.t24+"…");
    const jsString=x=>JSON.stringify(String(x));
    sendScript(`
      function findLayer(container,wantedName){
        for(var i=0;i<container.layers.length;i++){
          var layer=container.layers[i];
          if(layer.name===wantedName)return layer;
          try{if(layer.layers&&layer.layers.length){var f=findLayer(layer,wantedName);if(f)return f;}}catch(_){}
        } return null;
      }
      function replaceText(layerName,value){
        var layer=findLayer(app.activeDocument,layerName);
        if(!layer)throw new Error("Missing editable layer: "+layerName);
        if(!layer.textItem)throw new Error("Layer is not editable text: "+layerName);
        layer.textItem.contents=value;
      }
      try{
        replaceText("__DATE__",${jsString(v.date)});
        replaceText("__TIME_TOP__",${jsString(v.t12)});
        replaceText("__TIME_BOTTOM__",${jsString(v.t12)});
        replaceText("__TIME_MESSAGE__",${jsString(v.t24)});
        replaceText("__BOARD__",${jsString(b)});
        app.activeDocument.saveToOE("jpg:1.0");
      }catch(e){app.echoToOE("__ERROR__"+e.toString());}
    `);
  };
})();
</script>

<script>
(() => {
  const ACCESS_CODE = "110101";
  const lock = document.getElementById("lock");
  const code = document.getElementById("accessCode");
  const open = document.getElementById("unlock");
  const err = document.getElementById("lockError");
  function unlock(){
    if(code.value === ACCESS_CODE){
      sessionStorage.setItem("itickets_access","ok");
      lock.style.display="none";
    } else {
      err.textContent="Wrong access code";
      code.value="";
      code.focus();
    }
  }
  if(sessionStorage.getItem("itickets_access")==="ok") lock.style.display="none";
  open.addEventListener("click", unlock);
  code.addEventListener("keydown", e => { if(e.key==="Enter") unlock(); });
})();
</script>
