<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>iTickets</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f4f6;color:#111;font-family:Arial,sans-serif}
    .wrap{max-width:520px;margin:auto;padding:24px 18px 40px}
    .card{background:white;border-radius:18px;padding:22px;box-shadow:0 5px 24px rgba(0,0,0,.08)}
    h1{margin:0 0 4px;font-size:30px}
    .sub,.status{color:#666;font-size:14px}
    .status{margin:14px 0;padding:10px 12px;background:#f3f3f3;border-radius:10px}
    label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}
    input{width:100%;font-size:22px;padding:13px;border:1px solid #bbb;border-radius:10px}
    button{width:100%;margin-top:18px;padding:15px;border:0;border-radius:11px;background:#111;color:#fff;font-size:17px;font-weight:700}
    button:disabled{opacity:.45}
    #preview{display:none;width:100%;margin-top:18px;border-radius:10px}
    #photopea{position:fixed;width:1px;height:1px;border:0;opacity:0;pointer-events:none}
    .small{font-size:12px;color:#777;margin-top:10px}
  
    #lock{position:fixed;inset:0;z-index:9999;background:#f4f4f6;display:flex;align-items:center;justify-content:center;padding:20px}
    #lock .box{width:min(420px,100%);background:#fff;padding:24px;border-radius:18px;box-shadow:0 5px 24px rgba(0,0,0,.10)}
    #lock h2{margin:0 0 6px;font-size:27px}
    #lock p{color:#666;margin:0 0 15px}
    #lockError{min-height:20px;color:#b00020;font-size:13px;margin-top:8px}

    #preview { cursor: zoom-in; }
    #imageViewer{
      position:fixed; inset:0; z-index:99999; display:none;
      background:rgba(0,0,0,.97); overflow:auto;
      -webkit-overflow-scrolling:touch; touch-action:pinch-zoom;
    }
    #imageViewer.open{display:flex; align-items:center; justify-content:center;}
    #viewerImage{
      display:block; width:auto; height:auto; max-width:none; max-height:none;
      object-fit:contain;
    }
    #viewerClose{
      position:fixed; top:14px; right:14px; z-index:100000;
      width:46px; height:46px; border:0; border-radius:50%;
      font-size:28px; line-height:46px; padding:0; cursor:pointer;
      background:rgba(255,255,255,.9); color:#111;
    }

</style>
</head>
<body>

<div id="lock">
  <div class="box">
    <h2>iTickets</h2>
    <p>Private access</p>
    <label for="accessCode">ACCESS CODE</label>
    <input id="accessCode" type="password" inputmode="numeric" autocomplete="off">
    <button id="unlock">OPEN</button>
    <div id="lockError"></div>
  </div>
</div>

<main class="wrap">
  <section class="card">
    <h1>iTickets</h1>
    <div class="sub">Automatic date & time · HQ JPG</div>
    <div id="status" class="status">Loading PSD engine…</div>

    <label for="board">BOARD</label>
    <input id="board" value="0821" inputmode="numeric" autocomplete="off">

    <button id="generate" disabled>LOADING…</button>
    <img id="preview" alt="Generated image" title="Long-press the image to save it">
    <div class="small">After generation, tap SAVE IMAGE. The JPG is stamped with the current date/time before download. The button shows SAVED when the download starts.</div>
    <button id="saveAgain" style="display:none">SAVE IMAGE</button>
  </section>
</main>

<iframe id="photopea"
  src="https://www.photopea.com#%7B%22environment%22%3A%7B%22vmode%22%3A2%2C%22intro%22%3Afalse%2C%22localsave%22%3Afalse%7D%7D">
</iframe>

<script>
(() => {
  "use strict";
  const pp = document.getElementById("photopea");
  const status = document.getElementById("status");
  const button = document.getElementById("generate");
  const board = document.getElementById("board");
  const preview = document.getElementById("preview");
  const saveAgain = document.getElementById("saveAgain");
  const PHOTOPEA_ORIGIN = "https://www.photopea.com";
  let state = "boot", busy = false, lastBlob = null, lastUrl = null;

  function setStatus(t){ status.textContent=t; }
  function fail(t){ busy=false; setStatus("Error: "+t); button.disabled = state!=="ready"; button.textContent="GENERATE HQ JPG"; }
  function sendScript(s){ pp.contentWindow.postMessage(s, PHOTOPEA_ORIGIN); }

  async function loadPsd(){
    try{
      const r=await fetch("./template.psd",{cache:"no-store"});
      if(!r.ok) throw new Error("template.psd HTTP "+r.status);
      pp.contentWindow.postMessage(await r.arrayBuffer(), PHOTOPEA_ORIGIN);
    }catch(e){ fail("PSD load error: "+e.message); }
  }

  const tagScript = `
    function findLayer(container,wantedName){
      for(var i=0;i<container.layers.length;i++){
        var layer=container.layers[i];
        if(layer.name===wantedName)return layer;
        try{if(layer.layers&&layer.layers.length){var f=findLayer(layer,wantedName);if(f)return f;}}catch(_){}
      } return null;
    }
    function renameRequired(oldName,newName){
      var layer=findLayer(app.activeDocument,oldName);
      if(!layer)throw new Error("Missing PSD layer: "+oldName);
      layer.name=newName;
    }
    try{
      renameRequired("08.09.2026","__DATE__");
      renameRequired("3:12 PM SUS","__TIME_TOP__");
      renameRequired("3:12 PM JOS","__TIME_BOTTOM__");
      renameRequired("15:12 Ora in Mesaj","__TIME_MESSAGE__");
      renameRequired("0821 Bord Nr","__BOARD__");
      app.echoToOE("__READY__");
    }catch(e){app.echoToOE("__ERROR__"+e.toString());}
  `;

  function pad(n){return String(n).padStart(2,"0")}
  function valuesNow(){
    const d=new Date(), h=d.getHours(), h12=(h%12)||12, ap=h>=12?"PM":"AM";
    return {
      date:pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear(),
      t24:pad(h)+":"+pad(d.getMinutes()),
      t12:h12+":"+pad(d.getMinutes())+" "+ap
    };
  }

  function showResult(blob){
    if(lastUrl) URL.revokeObjectURL(lastUrl);
    lastBlob=blob;
    lastUrl=URL.createObjectURL(blob);
    preview.src=lastUrl;
    preview.style.display="block";
    saveAgain.style.display="block";
  }

  function asciiBytes(str){
    const out=new Uint8Array(str.length);
    for(let i=0;i<str.length;i++) out[i]=str.charCodeAt(i)&255;
    return out;
  }

  function currentExifTime(){
    const d=new Date(), p=n=>String(n).padStart(2,"0");
    return d.getFullYear()+":"+p(d.getMonth()+1)+":"+p(d.getDate())+" "+
           p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
  }

  // Adds a fresh EXIF APP1 block with DateTime, DateTimeOriginal and DateTimeDigitized.
  async function withCurrentExif(blob){
    const jpg=new Uint8Array(await blob.arrayBuffer());
    if(jpg.length<2 || jpg[0]!==0xFF || jpg[1]!==0xD8) return blob;

    const dt=currentExifTime()+"\0";
    const dtb=asciiBytes(dt);
    const entries0=3, entriesExif=2;
    const ifd0Offset=8;
    const ifd0Size=2+entries0*12+4;
    const exifIfdOffset=ifd0Offset+ifd0Size;
    const exifIfdSize=2+entriesExif*12+4;
    const date0Offset=exifIfdOffset+exifIfdSize;
    const dateOrigOffset=date0Offset+dtb.length;
    const dateDigOffset=dateOrigOffset+dtb.length;
    const tiffLen=dateDigOffset+dtb.length;
    const tiff=new Uint8Array(tiffLen);
    const dv=new DataView(tiff.buffer);

    // TIFF header, little-endian ("II")
    tiff[0]=0x49;tiff[1]=0x49;
    dv.setUint16(2,42,true);
    dv.setUint32(4,ifd0Offset,true);

    function entry(off,tag,type,count,value){
      dv.setUint16(off,tag,true); dv.setUint16(off+2,type,true);
      dv.setUint32(off+4,count,true); dv.setUint32(off+8,value,true);
    }

    dv.setUint16(ifd0Offset,entries0,true);
    let e=ifd0Offset+2;
    entry(e,0x0132,2,dtb.length,date0Offset); e+=12;        // DateTime
    entry(e,0x8769,4,1,exifIfdOffset); e+=12;              // ExifIFDPointer
    entry(e,0x0112,3,1,1);                                // Orientation=1
    // SHORT value 1 occupies first two bytes of value field.
    dv.setUint16(e+8,1,true); dv.setUint16(e+10,0,true);
    dv.setUint32(ifd0Offset+2+entries0*12,0,true);

    dv.setUint16(exifIfdOffset,entriesExif,true);
    e=exifIfdOffset+2;
    entry(e,0x9003,2,dtb.length,dateOrigOffset); e+=12;     // DateTimeOriginal
    entry(e,0x9004,2,dtb.length,dateDigOffset);            // DateTimeDigitized
    dv.setUint32(exifIfdOffset+2+entriesExif*12,0,true);

    tiff.set(dtb,date0Offset);
    tiff.set(dtb,dateOrigOffset);
    tiff.set(dtb,dateDigOffset);

    const exifHead=asciiBytes("Exif\0\0");
    const payloadLen=exifHead.length+tiff.length;
    const segment=new Uint8Array(4+payloadLen);
    segment[0]=0xFF; segment[1]=0xE1;
    const jpegLength=payloadLen+2;
    segment[2]=(jpegLength>>8)&255; segment[3]=jpegLength&255;
    segment.set(exifHead,4);
    segment.set(tiff,4+exifHead.length);

    // Insert immediately after SOI. Readers normally use this first EXIF block.
    const out=new Uint8Array(jpg.length+segment.length);
    out.set(jpg.subarray(0,2),0);
    out.set(segment,2);
    out.set(jpg.subarray(2),2+segment.length);
    return new Blob([out],{type:"image/jpeg"});
  }

  async function saveImage(blob){
    if(!blob) return;
    saveAgain.disabled=true;
    saveAgain.textContent="SAVING…";
    try{
      const freshBlob=await withCurrentExif(blob);
      const fileName="iTickets_"+Date.now()+".jpg";
      const url=URL.createObjectURL(freshBlob);
      const a=document.createElement("a");
      a.href=url;
      a.download=fileName;
      a.rel="noopener";
      a.style.display="none";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),60000);
      saveAgain.textContent="SAVED ✓";
      setTimeout(()=>{saveAgain.textContent="SAVE IMAGE";saveAgain.disabled=false;},1300);
    }catch(e){
      saveAgain.textContent="SAVE IMAGE";
      saveAgain.disabled=false;
      alert("Save error: "+e.message);
    }
  }

  saveAgain.onclick=()=>{ saveImage(lastBlob); };

  window.addEventListener("message", e=>{
    if(e.source!==pp.contentWindow)return;
    const data=e.data;
    if(data==="done"){
      if(state==="boot"){state="loading_psd";loadPsd();return;}
      if(state==="loading_psd"){state="tagging";sendScript(tagScript);return;}
      return;
    }
    if(typeof data==="string"){
      if(data==="__READY__"){
        state="ready"; busy=false; setStatus("Ready");
        button.disabled=false; button.textContent="GENERATE HQ JPG"; return;
      }
      if(data.startsWith("__ERROR__")){fail(data.slice(9));return;}
    }
    if(data instanceof ArrayBuffer){
      busy=false; button.disabled=false; button.textContent="GENERATE HQ JPG";
      setStatus("Generated · image ready to save");
      const blob=new Blob([data],{type:"image/jpeg"});
      showResult(blob);
      // Keep the explicit SAVE IMAGE button for mobile browsers,
      // where a later user tap is the most reliable way to open Save/Share.

    }
  });

  button.onclick=()=>{
    if(state!=="ready"||busy)return;
    const b=board.value.trim();
    if(!b){alert("BOARD cannot be empty");return;}
    const v=valuesNow();
    busy=true;button.disabled=true;button.textContent="GENERATING…";
    setStatus("Generating "+v.date+" · "+v.t24+"…");
    const jsString=x=>JSON.stringify(String(x));
    sendScript(`
      function findLayer(container,wantedName){
        for(var i=0;i<container.layers.length;i++){
          var layer=container.layers[i];
          if(layer.name===wantedName)return layer;
          try{if(layer.layers&&layer.layers.length){var f=findLayer(layer,wantedName);if(f)return f;}}catch(_){}
        } return null;
      }
      function replaceText(layerName,value){
        var layer=findLayer(app.activeDocument,layerName);
        if(!layer)throw new Error("Missing editable layer: "+layerName);
        if(!layer.textItem)throw new Error("Layer is not editable text: "+layerName);
        layer.textItem.contents=value;
      }
      try{
        replaceText("__DATE__",${jsString(v.date)});
        replaceText("__TIME_TOP__",${jsString(v.t12)});
        replaceText("__TIME_BOTTOM__",${jsString(v.t12)});
        replaceText("__TIME_MESSAGE__",${jsString(v.t24)});
        replaceText("__BOARD__",${jsString(b)});
        app.activeDocument.saveToOE("jpg:1.0");
      }catch(e){app.echoToOE("__ERROR__"+e.toString());}
    `);
  };
})();
</script>

<script>
(() => {
  const ACCESS_CODE = "110101";
  const lock = document.getElementById("lock");
  const code = document.getElementById("accessCode");
  const open = document.getElementById("unlock");
  const err = document.getElementById("lockError");
  function unlock(){
    if(code.value === ACCESS_CODE){
      sessionStorage.setItem("itickets_access","ok");
      lock.style.display="none";
    } else {
      err.textContent="Wrong access code";
      code.value="";
      code.focus();
    }
  }
  if(sessionStorage.getItem("itickets_access")==="ok") lock.style.display="none";
  open.addEventListener("click", unlock);
  code.addEventListener("keydown", e => { if(e.key==="Enter") unlock(); });
})();

  const imageViewer=document.getElementById("imageViewer");
  const viewerImage=document.getElementById("viewerImage");
  const viewerClose=document.getElementById("viewerClose");

  function openFullPreview(){
    if(!lastUrl) return;
    viewerImage.src=lastUrl;
    imageViewer.classList.add("open");
    imageViewer.setAttribute("aria-hidden","false");
    document.body.style.overflow="hidden";
  }
  function closeFullPreview(){
    imageViewer.classList.remove("open");
    imageViewer.setAttribute("aria-hidden","true");
    viewerImage.removeAttribute("src");
    document.body.style.overflow="";
  }
  preview.addEventListener("click",openFullPreview);
  viewerClose.addEventListener("click",closeFullPreview);
  imageViewer.addEventListener("click",(e)=>{
    if(e.target===imageViewer) closeFullPreview();
  });
  document.addEventListener("keydown",(e)=>{
    if(e.key==="Escape" && imageViewer.classList.contains("open")) closeFullPreview();
  });

</script>


<div id="imageViewer" aria-hidden="true">
  <button id="viewerClose" type="button" aria-label="Close">×</button>
  <img id="viewerImage" alt="iTickets full resolution">
</div>

</body>
</html>
