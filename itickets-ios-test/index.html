<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090909">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="iTickets">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>iTickets</title>
<style>
:root{--bg:#090909;--card:#181818;--line:#343434;--muted:#9b9b9b;--orange:#ff8419;--white:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{max-width:520px;margin:auto;padding:12px 18px 28px}.hero{width:100%;height:auto;max-height:210px;object-fit:contain;display:block;margin:0 0 14px;border-radius:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 18px;margin-bottom:12px}.label{font-size:14px;color:var(--muted);margin-bottom:7px}.city{font-size:22px;font-weight:750}.modes{display:flex;gap:8px;margin-top:9px}.mode{flex:1;height:64px;border:1px solid #eee;background:#1f1f1f;border-radius:12px;color:#fff;font-weight:750;font-size:15px;display:flex;align-items:center;justify-content:center;gap:7px}.mode img{width:38px;height:38px;object-fit:contain}.mode.active{border-color:var(--orange);color:var(--orange);opacity:1}.mode:not(.active){opacity:.82}.board-title{font-size:17px;color:#ddd}.hint{font-size:13px;color:#969696;margin-top:3px}.board{width:100%;height:76px;margin-top:12px;border:1px solid #787878;border-radius:12px;background:#121212;color:#fff;font-size:30px;text-align:center;outline:none}.qty{height:76px;display:flex;align-items:center;padding:10px 12px 10px 18px}.qty img{width:42px;height:42px;object-fit:contain}.qty-label{font-size:17px;flex:1;margin-left:8px}.qnum{width:42px;text-align:center;font-size:22px}.qbtn{width:58px;height:50px;margin-left:3px;border:1px solid #505050;border-radius:10px;background:#272727;color:#fff;font-size:25px}.buy{width:100%;height:62px;border:0;border-radius:12px;background:var(--orange);color:#000;font-size:19px;font-weight:800;margin:2px 0 0}.buy:disabled{opacity:.55}.status{text-align:center;color:#969696;font-size:13px;padding:10px 0 14px}.active-title{display:flex;align-items:center;font-size:20px;font-weight:800}.active-title img{width:38px;height:38px;object-fit:contain;margin-right:10px}.none{color:#969696;font-size:14px;margin-top:14px;line-height:1.4}.result{display:none;margin-top:12px}.result.show{display:block}.result img{display:none!important}.actions{display:flex;gap:8px;margin-top:10px}.action{flex:1;height:48px;border-radius:10px;border:1px solid #555;background:#222;color:#fff;font-weight:700}.action.primary{border-color:var(--orange);color:var(--orange)}
#photopea{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px;top:-10px}
</style>
</head>
<body>
<div class="app">
<img class="hero" src="assets/chisinau_transport_header.png" alt="iTickets Chișinău">
<div class="card"><div class="label">Choose the city</div><div class="city">Chișinău &nbsp;›</div></div>
<div class="card"><div class="label">Choose the transport</div><div class="modes"><button class="mode active" id="trolley"><img src="assets/icon_trolleybus.png">Trolleybus</button><button class="mode" id="bus"><img src="assets/icon_bus.png">Bus</button></div></div>
<div class="card"><div class="board-title">Enter the board number</div><div class="hint">If 3 digits, start with 0</div><input id="board" class="board" inputmode="numeric" maxlength="8" value="0821"></div>
<div class="card qty"><img src="assets/icon_ticket.png"><div class="qty-label">Number of tickets</div><div id="qnum" class="qnum">1</div><button id="minus" class="qbtn">−</button><button id="plus" class="qbtn">+</button></div>
<button id="buy" class="buy" disabled>LOADING…</button><div id="status" class="status">Loading PSD engine…</div>
<div id="result" class="result"><div class="actions"><button id="share" class="action primary">Save / Share</button><button id="open" class="action">Open image</button></div></div>
<div class="card"><div class="active-title"><img src="assets/icon_ticket.png">Active tickets</div><div class="none">No active tickets available<br>Your purchased tickets will appear here.</div></div>
</div>
<iframe id="photopea" src="https://www.photopea.com#%7B%22environment%22%3A%7B%22vmode%22%3A2%2C%22intro%22%3Afalse%2C%22localsave%22%3Afalse%7D%7D"></iframe>
<script src="app.js?v=4"></script>
</body></html>
